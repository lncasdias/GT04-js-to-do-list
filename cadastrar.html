<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Lista de Tarefas</title>
  </head>
  <body class="bg-[#a1281c] h-screen flex justify-center items-center">
    <div class="bg-[#e8d6c0] shadow-lg rounded-lg p-4">
      <a href="/index.hmtl" class="uppercase text-right text-2xl block">➔</a>
      <h1 class="font-bold text-xl mb-6">Cadastre-se</h1>
      <form class="flex flex-col w-100" onsubmit="cadastrar()">
        <label for="nome" class="uppercase textxs font-bold mb-2 block"
          >Nome</label
        >
        <input
          type="text" id="nome"
          placeholder="Seu nome"
          class="pl-3 h-10 border-2 border-slate-400 focus:border-[#a1281c] duration-150 rounded outline-none mb-4"
          required
        />
        <label for="email" class="uppercase textxs font-bold mb-2 block"
          >E-mail</label
        >
        <input id="email"
          type="email"
          placeholder="email@email.com"
          class="pl-3 h-10 border-2 border-slate-400 focus:border-[#a1281c] duration-150 rounded outline-none mb-4"
          required
        />
        <label for="senha" class="uppercase textxs font-bold mb-2 block"
          >Senha</label
        >
        <input
          type="password" id="senha"
          placeholder="Digite sua senha"
          class="pl-3 h-10 border-2 border-slate-400 focus:border-[#a1281c] duration-150 rounded outline-none"
          required
        />
        <button
          type="submit"
          class="w-full h-10 rounded bg-[#92938d] text-black duration-200 hover:bg-[#a1281c] hover:text-white font-bold mt-4 cursor-pointer"
        >
          Cadastrar
        </button>
      </form>
    </div>

    <script>
        function cadastrar(){
            event.preventDefault();

            let nome = document.querySelector("#nome").value;
            let email = document.querySelector("#email").value;
            let senha = document.querySelector("#senha").value;
            
            let dados = {
                nome,
                email,
                senha
            }

            fetch("https://js-lista-de-tarefas-api.onrender.com/usuarios", {
                method: "post",
                headers: {
                    "Content-type": "application/json"
                },
                body: JSON.stringify(dados)
            })
            .then(resposta => resposta.json())
            .then(json => {
                if (json.tipo == "error"){
                    alert(json.mensagem);
                    return;
                }

                alert(json.mensagem);
                window.location.href = "index.html";
            })

            .catch(error => {
                alert(error.message)
            })
        }


    </script>
  </body>
</html>
