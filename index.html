<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Lista de Tarefas</title>
</head>
<body class="bg-[#a1281c] h-screen flex justify-center items-center">
    <div class="bg-[#e8d6c0] shadow-lg rounded-lg p-4">
        <h1 class="font-bold text-xl mb-6">Seja bem-vindo(a)!</h1>
        <form class="flex flex-col w-100">
            <label for="email" class="uppercase textxs font-bold mb-2 block">E-mail</label>
            <input type="email" placeholder="email@email.com" class="pl-3 h-10 border-2 border-slate-400 focus:border-[#a1281c] duration-150 rounded outline-none mb-4" required />
            <label for="senha" class="uppercase textxs font-bold mb-2 block">Senha</label>
            <input type="password" placeholder="Digite sua senha" class="pl-3 h-10 border-2 border-slate-400 focus:border-[#a1281c] duration-150 rounded outline-none" required />
            <a href="/cadastrar.hmtl" class="my-2 text-right">Cadastre-se</a>
            <button type="submit" class="w-full h-10 rounded bg-[#92938d] text-black hover:text-white duration-200 hover:bg-[#a1281c] hover:text-white font-bold">Logar</button>
        </form>
    </div>

    <!-- <script src="index.js"></script> -->
</body>
</html>
